<!DOCTYPE html>
<html lang="en">
<head>
    <title>Upload Photos - Donor Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/interview.css') }}">
    <style>
        .upload-container { max-width: 400px; margin: 0 auto; padding: 20px; }
        .upload-prompt { text-align: center; margin-bottom: 20px; color: #555; }
        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .photo-slot {
            aspect-ratio: 1; border: 2px dashed #ccc; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2em; color: #ccc; cursor: pointer; overflow: hidden;
        }
        .photo-slot.filled { border-style: solid; border-color: #4CAF50; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
        .status { text-align: center; margin: 15px 0; font-weight: bold; }
        .status.success { color: #4CAF50; }
        .status.error { color: #f44336; }
        .submit-btn {
            width: 100%; padding: 15px; font-size: 1.1em;
            background: #4CAF50; color: white; border: none; border-radius: 8px;
            cursor: pointer; margin-top: 20px;
        }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="upload-container">
        <div class="card">
            <h2>Upload Your Photos</h2>
            <p class="upload-prompt">
                Upload three pictures that represent what a new kidney could do for you.
                These could be photos of family, hobbies, or dreams you want to pursue.
            </p>

            <div class="photo-grid">
                <div class="photo-slot" id="photo0">+</div>
                <div class="photo-slot" id="photo1">+</div>
                <div class="photo-slot" id="photo2">+</div>
            </div>

            <input type="file" id="libraryInput" accept="image/*" multiple>
            <input type="file" id="cameraInput" accept="image/*" capture="environment">
            <button class="submit-btn" type="button" onclick="selectPhoto('library')">
                Choose from Photo Library
            </button>
            <button class="submit-btn" type="button" onclick="selectPhoto('camera')">
                Take a New Photo
            </button>

            <div class="status" id="status"></div>

            <button class="submit-btn" id="submitBtn" disabled>
                Upload Complete - Close This Page
            </button>
        </div>
    </div>

    <script>
        const appBasePath = {{ request.script_root | tojson }};
        const appUrl = (path) => `${appBasePath}${path.startsWith('/') ? path : '/' + path}`;
        const sessionId = '{{ session_id }}';
        const uploadToken = '{{ upload_token }}';
        let currentSlot = 0;
        let uploadedCount = 0;

        function selectPhoto(mode, slotIndex = null) {
            currentSlot = slotIndex === null ? uploadedCount : slotIndex;
            document.getElementById(mode === 'camera' ? 'cameraInput' : 'libraryInput').click();
        }

        async function uploadOnePhoto(file) {
            const formData = new FormData();
            formData.append('session_id', sessionId);
            formData.append('upload_token', uploadToken);
            formData.append('photo', file);
            formData.append('source', 'mobile');

            setStatus('Uploading...', '');

            try {
                const res = await fetch(appUrl('/api/upload'), { method: 'POST', body: formData });
                const data = await res.json();

                if (data.error) {
                    setStatus(data.error, 'error');
                    return;
                }

                const slotIndex = Math.max(0, data.photo_count - 1);
                const slot = document.getElementById(`photo${slotIndex}`);
                const reader = new FileReader();
                reader.onload = (e) => {
                    slot.innerHTML = `<img src="${e.target.result}">`;
                    slot.classList.add('filled');
                };
                reader.readAsDataURL(file);

                uploadedCount = data.photo_count;
                setStatus(`${uploadedCount}/3 photos uploaded. The desktop page should update automatically.`, 'success');

                if (data.ready) {
                    document.getElementById('submitBtn').disabled = false;
                    setStatus('All photos uploaded. Return to the desktop page to review and generate.', 'success');
                }
                return data;
            } catch (err) {
                setStatus('Upload failed. Try again, or use the desktop upload button.', 'error');
                throw err;
            }
        }

        async function uploadSelectedPhoto(e) {
            const files = Array.from(e.target.files || []);
            if (!files.length) return;

            try {
                for (const file of files) {
                    if (uploadedCount >= 3) break;
                    const data = await uploadOnePhoto(file);
                    if (data.ready) break;
                }
            } finally {
                e.target.value = '';
            }
        }

        document.getElementById('libraryInput').addEventListener('change', uploadSelectedPhoto);
        document.getElementById('cameraInput').addEventListener('change', uploadSelectedPhoto);
        document.querySelectorAll('.photo-slot').forEach((slot, index) => {
            slot.addEventListener('click', () => selectPhoto('library', index));
        });

        document.getElementById('submitBtn').addEventListener('click', () => {
            window.close();
        });

        function setStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status ' + type;
        }

        // Check existing photos on load
        fetch(appUrl(`/api/photos/${sessionId}?token=${encodeURIComponent(uploadToken)}`))
            .then(async r => {
                const data = await r.json();
                if (!r.ok) throw new Error(data.error || 'Could not check uploaded photos.');
                return data;
            })
            .then(data => {
                uploadedCount = data.photo_count || 0;
                (data.photos || []).forEach((url, index) => {
                    const slot = document.getElementById(`photo${index}`);
                    if (slot) {
                        slot.innerHTML = `<img src="${url}" alt="Uploaded photo">`;
                        slot.classList.add('filled');
                    }
                });
                if (uploadedCount > 0) {
                    setStatus(`${uploadedCount}/3 photos already uploaded`, 'success');
                }
                if (data.ready) {
                    document.getElementById('submitBtn').disabled = false;
                }
            })
            .catch(err => setStatus(err.message, 'error'));
    </script>
</body>
</html>
