<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ meta_title }}</title>
    <meta name="description" content="{{ meta_description }}">
    <link rel="canonical" href="{{ url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/microsite_tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/microsite_campaign.css') }}">

    <meta property="og:site_name" content="Ludi Donor Stories">
    <meta property="og:title" content="{{ meta_title }}">
    <meta property="og:description" content="{{ meta_description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ url }}">
    {% if meta_image %}
    <meta property="og:image" content="{{ meta_image }}">
    <meta property="og:image:alt" content="{{ meta_title }}">
    {% endif %}
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ meta_title }}">
    <meta name="twitter:description" content="{{ meta_description }}">
    {% if meta_image %}
    <meta name="twitter:image" content="{{ meta_image }}">
    {% endif %}
    <script>
        /* Enable scroll-reveal only when JS is on and motion is welcome; content is visible by default otherwise. */
        try { if (window.matchMedia && !matchMedia('(prefers-reduced-motion: reduce)').matches) { document.documentElement.classList.add('js-reveal'); } } catch (e) {}
    </script>
</head>
<body class="campaign-page">
    <a class="skip-link" href="#main-content">Skip to story</a>
    {% include "_donor_campaign_body.html" %}

    <script>
        function copyCampaignLink(url) {
            const write = navigator.clipboard
                ? navigator.clipboard.writeText(url)
                : Promise.resolve(window.prompt('Copy this link:', url));
            write.then(() => {
                const btn = document.getElementById('copyBtn');
                if (!btn) return;
                btn.textContent = 'Copied';
                setTimeout(() => { btn.textContent = 'Copy Link'; }, 2000);
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (!document.documentElement.classList.contains('js-reveal')) return;
            var els = document.querySelectorAll('.reveal');
            if (!('IntersectionObserver' in window)) { els.forEach(function (el) { el.classList.add('is-in'); }); return; }
            var io = new IntersectionObserver(function (entries) {
                entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); } });
            }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
            els.forEach(function (el) { io.observe(el); });
        });

        document.addEventListener('DOMContentLoaded', function () {
            var bar = document.querySelector('.campaign-topbar');
            if (!bar) return;
            var sync = function () { bar.classList.toggle('is-over-hero', window.scrollY < window.innerHeight * 0.7); };
            window.addEventListener('scroll', sync, { passive: true });
            window.addEventListener('resize', sync, { passive: true });
            sync();
        });
    </script>
</body>
</html>
