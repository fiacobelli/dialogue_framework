<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ meta_title }}</title>
    <meta name="description" content="{{ meta_description }}">
    <link rel="canonical" href="{{ url }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/microsite_campaign.css') }}">

    <meta property="og:site_name" content="Ludi Donor Stories">
    <meta property="og:title" content="{{ meta_title }}">
    <meta property="og:description" content="{{ meta_description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ url }}">
    {% if meta_image %}
    <meta property="og:image" content="{{ meta_image }}">
    <meta property="og:image:alt" content="{{ meta_title }}">
    {% endif %}
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ meta_title }}">
    <meta name="twitter:description" content="{{ meta_description }}">
    {% if meta_image %}
    <meta name="twitter:image" content="{{ meta_image }}">
    {% endif %}
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to story</a>
    {% include "_donor_campaign_body.html" %}

    <script>
        function copyCampaignLink(url) {
            const write = navigator.clipboard
                ? navigator.clipboard.writeText(url)
                : Promise.resolve(window.prompt('Copy this link:', url));
            write.then(() => {
                const btn = document.getElementById('copyBtn');
                if (!btn) return;
                btn.textContent = 'Copied';
                setTimeout(() => { btn.textContent = 'Copy Link'; }, 2000);
            });
        }
    </script>
</body>
</html>
