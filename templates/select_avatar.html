<!DOCTYPE html>
<html lang="en">
<head>
    <title>Choose Your Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/interview.css">
    <style>
        .avatar-selection { max-width: 700px; margin: 0 auto; padding: 20px; }
        .avatar-selection h1 { text-align: center; margin-bottom: 10px; }
        .avatar-selection > p { text-align: center; color: #666; margin-bottom: 20px; }

        .avatar-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .avatar-option {
            border: 3px solid #ddd;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            width: 160px;
            text-align: center;
        }
        .avatar-option:hover { border-color: #4CAF50; }
        .avatar-option.selected { border-color: #4CAF50; background: #e8f5e9; }
        .avatar-option h3 { margin: 8px 0 0; font-size: 1.1em; }

        .avatar-thumb {
            width: 140px;
            height: 165px;
            overflow: hidden;
            margin: 0 auto;
        }
        .avatar-thumb iframe {
            width: 250px;
            height: 300px;
            border: none;
            pointer-events: none;
            transform: scale(0.55);
            transform-origin: top left;
        }

        .start-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 25px auto 0;
            padding: 15px;
            font-size: 1.1em;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .start-btn:hover:not(:disabled) { background: #45a049; }
        .start-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="avatar-selection">
        <div class="card">
            <h1>Choose Your Assistant</h1>
            <p>Select who you'd like to guide you through creating your donor page</p>

            <div class="avatar-options" id="avatarOptions"></div>

            <button class="start-btn" id="startBtn" disabled>Start Interview</button>
        </div>
    </div>

    <script>
        const avatars = {{ avatars | tojson }};
        let selectedAvatar = null;

        function selectAvatar(id) {
            selectedAvatar = id;
            document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
            document.querySelector(`[data-avatar="${id}"]`).classList.add('selected');
            document.getElementById('startBtn').disabled = false;
        }

        // Build option cards with scaled iframe thumbnails
        const optionsContainer = document.getElementById('avatarOptions');
        Object.entries(avatars).forEach(([id, profile], index) => {
            const card = document.createElement('div');
            card.className = 'avatar-option';
            card.dataset.avatar = id;
            card.innerHTML = `
                <div class="avatar-thumb">
                    <iframe src="/avatar-preview/${profile.scene_id}"${index > 0 ? ' loading="lazy"' : ''}></iframe>
                </div>
                <h3>${profile.name}</h3>`;
            card.onclick = () => selectAvatar(id);
            optionsContainer.appendChild(card);
        });

        document.getElementById('startBtn').onclick = () => {
            if (selectedAvatar) {
                window.location.href = '/interview?avatar=' + selectedAvatar;
            }
        };
    </script>
</body>
</html>
