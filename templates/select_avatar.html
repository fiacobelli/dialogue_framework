<!DOCTYPE html>
<html lang="en">
<head>
    <title>Choose Your Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/base.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: clamp(20px, 4vw, 48px);
            background: linear-gradient(150deg, #FEF3E8 0%, #FEF6EC 60%, #FFF8F2 100%);
            animation: fade-in 0.5s ease-out both;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .selection-header {
            text-align: center;
            margin-bottom: clamp(24px, 4vw, 40px);
        }
        .selection-header h1 {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 700;
            color: #1C1917;
            margin-bottom: 10px;
        }
        .selection-header p {
            font-size: clamp(16px, 2.5vw, 20px);
            color: #78716C;
        }

        .avatar-options {
            display: flex;
            justify-content: center;
            gap: clamp(14px, 2.5vw, 24px);
            flex-wrap: wrap;
            margin-bottom: clamp(28px, 4vw, 44px);
            max-width: 1000px;
        }

        .avatar-option {
            background: #FFFDF9;
            border: 2.5px solid #F0E9E2;
            border-radius: 20px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease-out;
            width: clamp(140px, 20vw, 200px);
            text-align: center;
            box-shadow: 0 2px 12px rgba(28, 25, 23, 0.07);
        }
        .avatar-option:hover {
            border-color: #E86F2C;
            transform: translateY(-4px);
            box-shadow: 0 8px 28px rgba(232, 111, 44, 0.2);
        }
        .avatar-option.selected {
            border-color: #E86F2C;
            background: #FEF3E8;
            box-shadow: 0 8px 28px rgba(232, 111, 44, 0.25);
            transform: translateY(-4px);
        }
        .avatar-option h3 {
            margin-top: 10px;
            font-size: clamp(14px, 2vw, 17px);
            font-weight: 600;
            color: #1C1917;
        }

        .avatar-thumb {
            width: 100%;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            border-radius: 12px;
        }
        .avatar-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Checkmark badge on selected card */
        .avatar-option.selected .avatar-thumb::after {
            content: '✓';
            position: absolute;
            top: 8px; right: 8px;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: #E86F2C;
            color: white;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-option .avatar-thumb { position: relative; }

        .start-btn {
            display: block;
            padding: clamp(16px, 2.5vw, 20px) clamp(48px, 8vw, 72px);
            font-size: clamp(18px, 2.8vw, 22px);
            font-weight: 600;
            background: #E86F2C;
            color: white;
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(232, 111, 44, 0.4);
            transition: all 0.2s ease-out;
        }
        .start-btn:hover:not(:disabled) {
            background: #C45D20;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(232, 111, 44, 0.45);
        }
        .start-btn:disabled { background: #C8BEB8; box-shadow: none; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="selection-header">
        <h1>Choose Your Guide</h1>
        <p>Select who you'd like to speak with today</p>
    </div>

    <div class="avatar-options" id="avatarOptions"></div>

    <button class="start-btn" id="startBtn" disabled>Begin Screening</button>

    <script>
        const avatars = {{ avatars | tojson }};
        let selectedAvatar = null;

        function selectAvatar(id) {
            selectedAvatar = id;
            document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
            document.querySelector(`[data-avatar="${id}"]`).classList.add('selected');
            document.getElementById('startBtn').disabled = false;
        }

        // Shuffle for randomised presentation
        const entries = Object.entries(avatars);
        for (let i = entries.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [entries[i], entries[j]] = [entries[j], entries[i]];
        }

        const container = document.getElementById('avatarOptions');
        entries.forEach(([id, profile]) => {
            const card = document.createElement('div');
            card.className = 'avatar-option';
            card.dataset.avatar = id;
            card.innerHTML = `
                <div class="avatar-thumb">
                    <img src="/static/photos/avatars/${profile.scene_id}.png" alt="${profile.name || 'Avatar'}">
                </div>
                <h3>${profile.name || ''}</h3>`;
            card.onclick = () => selectAvatar(id);
            container.appendChild(card);
        });

        document.getElementById('startBtn').onclick = () => {
            if (selectedAvatar) window.location.href = '/screening?a=' + avatars[selectedAvatar].scene_id;
        };
    </script>
</body>
</html>
