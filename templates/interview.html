<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create Your Donor Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/interview.css">

    <!-- SitePal setup - MUST be before embed (copied from Prof's avatar.js) -->
    <script>
        let language = 1;
        let voice = 201;
        let engine = 11;

        function vh_sceneLoaded() {
            console.log('SitePal loaded');
            window.sitePalReady = true;
            document.dispatchEvent(new Event('sitePalReady'));
        }

        function vh_talkEnded() {
            console.log('SitePal talk ended');
            document.dispatchEvent(new Event('sitePalTalkEnded'));
        }

        function speakText(text) {
            if (window.sitePalReady && typeof sayText === 'function') {
                sayText(text, voice, language, engine);
            } else {
                // Fallback to Web Speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.9;
                utterance.onend = () => document.dispatchEvent(new Event('sitePalTalkEnded'));
                speechSynthesis.speak(utterance);
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <div id="conversation-screen">
            <div class="card">
                <h1>Create Your Donor Page</h1>
                <div class="phase-dots">
                    <span class="dot" id="dot-before"></span>
                    <span class="dot" id="dot-during"></span>
                    <span class="dot" id="dot-hope"></span>
                    <span class="dot" id="dot-photos"></span>
                </div>

                <!-- SitePal embed - copied exactly from Prof's index.html -->
                <div class="avatar-container">
                    <div id="avatar">
                        <script type="text/javascript" src="//vhss-d.oddcast.com/vhost_embed_functions_v4.php?acc=8688641&js=0"></script>
                        <script type="text/javascript">
                            AC_VHost_Embed(8688641, 300, 400, "", 1, 0, 2756814, 0, 1, 0, "3epui05wd6TRKAR6VBtYFvm4cKrZMwVw", 0, 0);
                        </script>
                    </div>
                </div>

                <div class="message-bubble" id="messageBubble">Loading...</div>
                <div class="mic-container">
                    <button id="micBtn">🎤</button>
                    <span class="mic-hint" id="micHint">Tap to speak</span>
                </div>
                <div class="input-row">
                    <input type="text" id="input" placeholder="Or type here...">
                    <button id="sendBtn">Send</button>
                </div>
                <div id="status"></div>
            </div>

            <div class="card photo-section" id="photoSection">
                <h3>Add Your Photos</h3>
                <p>Upload 3 photos for your donor page</p>
                <div class="photo-grid">
                    <div class="photo-slot" id="photo0">+</div>
                    <div class="photo-slot" id="photo1">+</div>
                    <div class="photo-slot" id="photo2">+</div>
                </div>
                <input type="file" id="photoInput" accept="image/*" style="display:none">
                <button class="upload-btn" onclick="document.getElementById('photoInput').click()">Upload Photo</button>
            </div>

            <div class="card" id="generateSection">
                <div class="name-input">
                    <label>Your Name for the Website:</label>
                    <input type="text" id="patientName" placeholder="Enter your name">
                </div>
                <button id="generateBtn">Generate My Donor Page</button>
            </div>

            <div class="card microsite-preview" id="micrositePreview">
                <h2 id="siteName"></h2>
                <div class="photo-grid" id="sitePhotos"></div>
                <div class="microsite-content" id="siteContent"></div>
                <div class="microsite-url" id="micrositeUrl"></div>
                <div class="share-section">
                    <h4>Share Your Page</h4>
                    <div class="share-buttons">
                        <a href="#" target="_blank" class="share-btn view" id="viewBtn">View Full Page</a>
                        <a href="#" target="_blank" class="share-btn fb" id="shareFb">Facebook</a>
                        <a href="#" target="_blank" class="share-btn wa" id="shareWa">WhatsApp</a>
                        <a href="#" class="share-btn email" id="shareEmail">Email</a>
                        <button class="share-btn copy" id="copyLinkBtn">Copy Link</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/config.js"></script>
    <script src="/static/js/TurnManager.js"></script>
    <script src="/static/js/SpeechManager.js"></script>
    <script src="/static/js/ConversationAPI.js"></script>
    <script src="/static/js/UIController.js"></script>
    <script src="/static/js/App.js"></script>
</body>
</html>
