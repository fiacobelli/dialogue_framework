<!DOCTYPE html>
<html>
<head>
    <title>Dialysis Assistant</title>
    <style>
        body { font-family: system-ui; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        #messages { height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        .user { color: #0066cc; }
        .bot { color: #333; }
        .msg { margin: 8px 0; line-height: 1.4; }
        .controls { display: flex; gap: 8px; margin-bottom: 10px; }
        #input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; }
        #sendBtn { background: #0066cc; color: white; }
        #micBtn { background: #28a745; color: white; }
        #micBtn.listening { background: #dc3545; }
        .options { margin-bottom: 10px; }
        .options label { margin-right: 15px; }
        #status { font-size: 12px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <h2>Dialysis Assistant</h2>
    <div class="options">
        <label><input type="checkbox" id="autoSpeak" checked> Auto-speak responses</label>
        <label><input type="checkbox" id="autoListen"> Auto-listen after response</label>
    </div>
    <div id="messages"></div>
    <div class="controls">
        <input type="text" id="input" placeholder="Type or click mic to speak..." autofocus>
        <button id="micBtn" onclick="toggleMic()">🎤</button>
        <button id="sendBtn" onclick="send()">Send</button>
    </div>
    <div id="status"></div>

    <script>
        let sessionId = null;
        const messages = document.getElementById('messages');
        const input = document.getElementById('input');
        const micBtn = document.getElementById('micBtn');
        const status = document.getElementById('status');
        const autoSpeak = document.getElementById('autoSpeak');
        const autoListen = document.getElementById('autoListen');

        // Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                input.value = text;
                setStatus('Heard: ' + text);
                send();
            };

            recognition.onerror = (e) => {
                setStatus('Error: ' + e.error);
                stopListening();
            };

            recognition.onend = () => stopListening();
        } else {
            micBtn.disabled = true;
            micBtn.title = 'Speech not supported';
        }

        // Speech Synthesis
        function speak(text) {
            if (!autoSpeak.checked) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.2;
            utterance.onend = () => {
                if (autoListen.checked && recognition) {
                    setTimeout(() => toggleMic(), 500);
                }
            };
            window.speechSynthesis.speak(utterance);
        }

        function toggleMic() {
            if (isListening) {
                recognition.stop();
            } else {
                window.speechSynthesis.cancel();
                recognition.start();
                isListening = true;
                micBtn.classList.add('listening');
                setStatus('Listening...');
            }
        }

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('listening');
        }

        function setStatus(msg) {
            status.textContent = msg;
        }

        async function init() {
            const res = await fetch('/api/session');
            const data = await res.json();
            sessionId = data.session_id;
            addMessage('bot', data.prompt);
            speak(data.prompt);
        }

        async function send() {
            const text = input.value.trim();
            if (!text) return;

            addMessage('user', text);
            input.value = '';
            setStatus('Processing...');

            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId, input: text })
            });
            const data = await res.json();
            addMessage('bot', data.prompt);
            speak(data.prompt);
            setStatus('');

            if (data.done) {
                input.disabled = true;
                micBtn.disabled = true;
            }
        }

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = (role === 'user' ? 'You: ' : 'Bot: ') + text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        input.addEventListener('keypress', e => { if (e.key === 'Enter') send(); });
        init();
    </script>
</body>
</html>
