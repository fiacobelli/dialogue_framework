<!DOCTYPE html>
<html lang="en">
<head>
    <title>Microsite Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Georgia, serif; background: #F8F1E8; color: #1C1917; }
        main { width: min(420px, calc(100vw - 32px)); background: #FFFDF9; border: 1px solid #E7DDD5; border-radius: 18px; padding: 28px; box-shadow: 0 20px 45px rgba(28,25,23,.12); }
        h1 { margin: 0 0 8px; font-size: 28px; }
        p { color: #78716C; line-height: 1.5; }
        label { display: block; margin-top: 16px; font-weight: 700; }
        input { width: 100%; box-sizing: border-box; border: 2px solid #E7DDD5; border-radius: 12px; margin-top: 6px; padding: 12px; font: inherit; }
        button { width: 100%; border: 0; border-radius: 12px; margin-top: 20px; padding: 13px 16px; background: #E86F2C; color: white; font-weight: 800; cursor: pointer; }
        .error { color: #B91C1C; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <h1>Microsite Admin</h1>
        {% if not admin_enabled %}
            <p class="error">Admin is disabled because ADMIN_PASSWORD is not configured.</p>
        {% else %}
            <p>Sign in to review sessions and manage published donor pages.</p>
            {% if error %}<p class="error">{{ error }}</p>{% endif %}
            <form method="post">
                <label for="username">Username</label>
                <input id="username" name="username" autocomplete="username" required>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit">Sign In</button>
            </form>
        {% endif %}
    </main>
</body>
</html>
