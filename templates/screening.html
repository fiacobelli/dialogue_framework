<!DOCTYPE html>
<html lang="en">
<head>
    <title>Health Screening</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/screening.css">

    <!-- Lock page scroll on this page only — panels handle their own overflow -->
    <style>
        @media (min-width: 768px) {
            html, body { height: 100%; overflow: hidden; }
        }
    </style>

    <!-- SitePal setup — MUST be before embed -->
    <script>
        const avatarProfile = {{ avatar_profile | tojson }};
        let language = avatarProfile.language || 1;
        let voice    = avatarProfile.voice    || 11;
        let engine   = avatarProfile.engine   || 4;

        function vh_sceneLoaded() {
            window.sitePalReady = true;
            document.dispatchEvent(new Event('sitePalReady'));
        }

        function vh_talkEnded() {
            document.dispatchEvent(new Event('sitePalTalkEnded'));
        }

        function speakText(text) {
            if (window.sitePalReady && typeof sayText === 'function') {
                sayText(text, voice, language, engine);
            } else {
                const u = new SpeechSynthesisUtterance(text);
                u.rate = 0.9;
                u.onend = () => document.dispatchEvent(new Event('sitePalTalkEnded'));
                speechSynthesis.speak(u);
            }
        }

        function stopSpeakText() {
            console.log('[stopSpeakText] sitePalReady:', window.sitePalReady, 'synthesis.speaking:', window.speechSynthesis.speaking);
            if (window.sitePalReady && typeof sayText === 'function') {
                sayText('.', voice, language, engine);
            } else {
                // Chrome bug: pause() before cancel() is needed to reliably stop speech
                window.speechSynthesis.pause();
                window.speechSynthesis.cancel();
            }
        }
    </script>
</head>
<body class="screening-page">

    <!-- ── Main split layout ────────────────────────────────────────────── -->
    <div id="conversation-screen">

        <!-- LEFT: Avatar panel -->
        <div class="avatar-panel">
            <!-- Start Over — bottom-left of avatar panel, visible during conversation -->
            <div class="restart-row" id="restartRow" style="display:none;">
                <button id="restartBtn">↺ Start Over</button>
            </div>
            <div class="avatar-frame" id="avatarFrame">
                <img id="avatarPreview" loading="eager"
                     src="/static/photos/avatars/{{ avatar_scene_id }}.png"
                     alt="Your health navigator">
                <div id="avatar">
                    <script type="text/javascript" src="//vhss-d.oddcast.com/vhost_embed_functions_v4.php?acc=8688641&js=0"></script>
                    <script type="text/javascript">
                        AC_VHost_Embed(8688641, 400, 533, "", 1, 0, {{ avatar_scene_id }}, 0, 1, 0, "3epui05wd6TRKAR6VBtYFvm4cKrZMwVw", 0, 0);
                    </script>
                </div>
            </div>
        </div>

        <!-- RIGHT: Interaction panel -->
        <div class="interaction-panel">

            <!-- Pre-conversation: patient ID form -->
            <div id="beginOverlay" class="begin-overlay">
                <h2>Let's get started</h2>
                <div class="pin-prompt">
                    <label for="lastNameInput">Last name (letters only)</label>
                    <input id="lastNameInput" type="text" inputmode="text" autocomplete="family-name" placeholder="e.g., Thompson">
                    <label for="dobInput">Date of birth</label>
                    <input id="dobInput" type="text" inputmode="numeric" placeholder="MM/DD/YYYY" maxlength="10">
                    <small>Format: two digits for month and day, four digits for year.</small>
                    <button id="beginBtn" class="begin-btn" disabled>Begin Screening</button>
                    <p class="pin-hint" id="pinHint"></p>
                </div>
            </div>

            <!-- Thank you screen (shown after screening completes) -->
            <div id="thankYouScreen" style="display:none;" class="thankyou-screen">
                <div class="thankyou-icon">&#10003;</div>
                <h2>You did great — thank you.</h2>
                <p class="thankyou-summary">Your care team will have everything they need to support you well.</p>
                <p class="thankyou-sub">A member of your care team will review your answers and follow up with you.</p>
            </div>

            <!-- Active conversation -->
            <div id="conversationUI" style="display:none;">

                <!-- TOP: message area — scrolls if text is long -->
                <div class="convo-top">
                    <div id="progress-bar-wrap" class="hidden">
                        <div id="progress-bar-fill"></div>
                    </div>
                    <div class="message-bubble" id="messageBubble"></div>
                    <button id="repeatBtn">&#8635; Repeat</button>
                </div>

                <!-- BOTTOM: mic + input — always visible, never overlapped -->
                <div class="convo-bottom">
                    <div class="mic-container">
                        <div class="mic-wrapper">
                            <button id="micBtn">
                                <svg class="mic-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <rect x="9" y="2" width="6" height="13" rx="3" fill="white"/>
                                    <path d="M5 11a7 7 0 0 0 14 0" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
                                    <line x1="12" y1="18" x2="12" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
                                    <line x1="9"  y1="22" x2="15" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                            </button>
                            <span class="mic-ring"></span>
                            <span class="mic-ring"></span>
                            <span class="mic-ring"></span>
                        </div>
                        <div class="waveform hidden" id="waveform">
                            <span class="wave-bar"></span>
                            <span class="wave-bar"></span>
                            <span class="wave-bar"></span>
                            <span class="wave-bar"></span>
                            <span class="wave-bar"></span>
                            <span class="wave-bar"></span>
                            <span class="wave-bar"></span>
                        </div>
                        <span class="mic-hint" id="micHint">Speak when ready</span>
                    </div>
                    <div class="input-row">
                        <span class="input-row-label">Or type your answer</span>
                        <div class="input-row-controls">
                            <input type="text" id="input" placeholder="Type here...">
                            <button id="sendBtn">Send</button>
                        </div>
                    </div>
                    <div id="status"></div>
                </div>

            </div>

        </div>
    </div>


    <script>
        window.AVATAR_ID      = '{{ avatar_id }}';
        window.AVATAR_PROFILE = {{ avatar_profile | tojson }};
    </script>
    <script src="/static/js/vad/bundle.min.js"></script>
    <script src="/static/js/config.js"></script>
    <script src="/static/js/TurnManager.js"></script>
    <script src="/static/js/SpeechManager.js"></script>
    <script src="/static/js/ConversationAPI.js"></script>
    <script src="/static/js/UIController.js"></script>
    <script src="/static/js/InputHandler.js"></script>
    <script src="/static/js/App.js"></script>
</body>
</html>
