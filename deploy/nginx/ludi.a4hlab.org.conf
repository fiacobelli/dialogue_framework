# Production nginx config for ludi.a4hlab.org (microsite + screening behind one server).
# REFERENCE / IaC ONLY — applied manually on EC2; nothing auto-applies this on git pull.
# Fix 2026-05-29: client_max_body_size 12M in /microsite so phone-camera photo uploads
# (QR flow, ~3MB) are not rejected with HTTP 413 (nginx default cap is 1MB).
#
server {
    listen 80;
    server_name ludi.a4hlab.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ludi.a4hlab.org;

    ssl_certificate /etc/letsencrypt/live/ludi.a4hlab.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ludi.a4hlab.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Read-only study-data viewer (sqlite-web), added 2026-07-21. Lets the
    # research team browse and export the study databases without SSH/SCP.
    # Service definition lives in the sdoh-screening repo: deploy/dbviewer.service
    # Password-gated by the app itself; nginx just proxies.
    location /dbadmin {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /microsite {
        client_max_body_size 12M;
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
